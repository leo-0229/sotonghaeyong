name: Deploy to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'locked-preview: no backend; connected: configured Supabase'
        required: true
        default: locked-preview
        type: choice
        options: [locked-preview, connected]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.mode == 'connected' && vars.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.mode == 'connected' && vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
      NEXT_PUBLIC_ENABLE_DEMO: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run audit:release -- --source
      - run: npm test
      - name: Check public backend configuration
        if: inputs.mode == 'connected'
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo 'Set NEXT_PUBLIC_SUPABASE_URL in repository Variables'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in repository Variables'; exit 1; }
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - run: npm run audit:release -- --out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
